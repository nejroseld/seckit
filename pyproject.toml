[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bluekit"
version = "0.1.0"
description = "Local security scanning for coding agents: secrets, SAST, SCA and IaC in one normalized report"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
bluekit = "bluekit.cli:main"

[tool.setuptools.packages.find]
include = ["bluekit*"]

[tool.setuptools.package-data]
bluekit = ["rules/*.yml"]
