[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardkit-local"
version = "0.1.0"
description = "Local security scans, reviewed fixes, and credential brokering for developer projects"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
guardkit = "guardkit.cli:main"

[tool.setuptools.packages.find]
include = ["guardkit*"]

[tool.setuptools.package-data]
guardkit = ["rules/*.yml"]
