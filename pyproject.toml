[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardkit-local"
version = "0.1.0"
description = "AI-native local security toolkit for coding agents with deterministic scans and reviewed fixes"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["cryptography>=50.0.1"]

[project.scripts]
guardkit = "guardkit.cli:main"

[tool.setuptools.packages.find]
include = ["guardkit*"]

[tool.setuptools.package-data]
guardkit = ["rules/*.yml", "ui/*.html"]
