name: Seckit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: seckit --version
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m seckit init
      - run: python benchmarks/acceptance.py
      - run: python -m unittest discover -s tests -p "test_cli_live.py" -v
        env:
          SECKIT_LIVE_SCANNERS: "1"
      - run: python -m unittest discover -s tests -p "test_scanning_live.py" -v
        env:
          SECKIT_LIVE_SCANNERS: "1"
