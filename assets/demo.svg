    <text x="36" y="148"><tspan fill="#8b949e">Detected:</tspan> Python, FastAPI, Node.js, React, GitHub Actions</text>
    <text x="36" y="182" font-weight="700" fill="#f0f6fc">3 issue(s) to review</text>

