rules:
  - id: seckit.javascript.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval executes a dynamically constructed string and may enable code injection.
    pattern: eval(...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: Attacker-controlled content may execute as code in the application context.
      remediation: Avoid eval; use explicit parsing or a safe dispatch table.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.dynamic-function
    languages: [javascript, typescript]
    severity: WARNING
    message: The Function constructor evaluates dynamically constructed source code.
    pattern: new Function(...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: Untrusted input may execute as code.
      remediation: Replace dynamic code generation with fixed, explicit logic.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.child-process-exec
    languages: [javascript, typescript]
    severity: WARNING
    message: child_process.exec invokes a shell; interpolated input may cause command injection.
    pattern-either:
      - pattern: require('child_process').exec(...)
      - pattern: require('node:child_process').exec(...)
      - patterns:
          - pattern-inside: |
              import * as $CP from 'child_process';
              ...
          - pattern: $CP.exec(...)
      - patterns:
          - pattern-inside: |
              import * as $CP from 'node:child_process';
              ...
          - pattern: $CP.exec(...)
      - patterns:
          - pattern-inside: |
              const $CP = require('child_process');
              ...
          - pattern: $CP.exec(...)
      - patterns:
          - pattern-inside: |
              const $CP = require('node:child_process');
              ...
          - pattern: $CP.exec(...)
    metadata:
      category: security
      confidence: LOW
      impact: Untrusted arguments may execute shell commands with server privileges.
      remediation: Prefer execFile or spawn with an argument array and validate input.
      license: FSL-1.1-ALv2
  - id: seckit.react.dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: dangerouslySetInnerHTML bypasses React escaping and can create cross-site scripting.
    pattern: >-
      <$TAG ... dangerouslySetInnerHTML={{__html: $VALUE}} ... />
    metadata:
      category: security
      confidence: MEDIUM
      impact: Untrusted HTML may execute scripts in visitors' browsers.
      remediation: Avoid raw HTML or sanitize it with a maintained allowlist sanitizer.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5 or SHA-1 is unsuitable for password storage or security-sensitive integrity checks.
    pattern-either:
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash('sha1')
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
    metadata:
      category: security
      confidence: LOW
      impact: Weak hashes may be vulnerable to collision attacks or password cracking.
      remediation: Use a modern cryptographic hash; use a password hashing function for passwords.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.sql-injection
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: Request data reaches a SQL query string; use parameterized queries.
    pattern-sources:
      - pattern: $REQ.query[$KEY]
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.params[$KEY]
      - pattern: $REQ.params.$FIELD
      - pattern: $REQ.body[$KEY]
      - pattern: $REQ.body.$FIELD
    pattern-sinks:
      - pattern: $DB.query($QUERY)
      - pattern: $DB.execute($QUERY)
    metadata:
      category: security
      confidence: MEDIUM
      impact: An attacker may alter SQL commands and read or modify database records.
      remediation: Use parameterized queries and bind user values separately from SQL text.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.ssrf
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    message: Request-controlled URL reaches an outbound HTTP request.
    pattern-sources:
      - pattern: $REQ.query[$KEY]
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.params[$KEY]
      - pattern: $REQ.body[$KEY]
      - pattern: $REQ.body.$FIELD
    pattern-sinks:
      - pattern: fetch($URL, ...)
      - pattern: axios.get($URL, ...)
      - pattern: axios.post($URL, ...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: An attacker may cause server requests to internal or restricted network services.
      remediation: Allowlist destinations and reject private, loopback, and link-local addresses after resolution.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.open-redirect
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    message: Request-controlled URL reaches a browser navigation sink.
    pattern-sources:
      - pattern: location.search
      - pattern: location.hash
    pattern-sinks:
      - pattern: window.location = $URL
      - pattern: window.location.href = $URL
      - pattern: window.location.assign($URL)
    metadata:
      category: security
      confidence: MEDIUM
      impact: A crafted link may redirect users to a malicious site.
      remediation: Allowlist local destinations or validate the URL origin before navigation.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.express-open-redirect
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    message: Request-controlled URL reaches Express redirect.
    pattern-sources:
      - pattern: $REQ.query[$KEY]
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.params[$KEY]
      - pattern: $REQ.body[$KEY]
    pattern-sanitizers:
      - pattern: "$ALLOWED.has($URL) ? $URL : $DEFAULT"
      - pattern: "$ALLOWED.includes($URL) ? $URL : $DEFAULT"
    pattern-sinks:
      - pattern: $RES.redirect($URL)
    metadata:
      category: security
      confidence: MEDIUM
      impact: A crafted request may redirect users to a malicious site.
      remediation: Allowlist relative destinations and reject external URL schemes and hosts.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.jwt-decode-unverified
    languages: [javascript, typescript]
    severity: WARNING
    message: jwt.decode parses a token without verifying its signature; do not trust decoded claims.
    pattern: jwt.decode(...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: Unverified token claims may be forged by an attacker.
      remediation: Verify signatures and enforce expected issuer, audience, expiry, and algorithm before using claims.
      license: FSL-1.1-ALv2
  - id: seckit.javascript.cors-reflect-credentials
    languages: [javascript, typescript]
    severity: ERROR
    message: CORS reflects arbitrary request origins while enabling credentials.
    patterns:
      - pattern: cors({...})
      - pattern-either:
          - pattern: 'cors({origin: true, credentials: true, ...})'
          - pattern: 'cors({credentials: true, origin: true, ...})'
    metadata:
      category: security
      confidence: HIGH
      impact: Cross-origin sites may be able to issue credentialed requests to the application.
      remediation: Allowlist trusted origins and review whether credentialed cross-origin access is required.
      license: FSL-1.1-ALv2
