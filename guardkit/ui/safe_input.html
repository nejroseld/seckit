<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Guardkit Safe Input</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
    main { width: min(100%, 420px); margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
    .service { margin: 0 0 16px; color: light-dark(#626262, #b8b8b8); overflow-wrap: anywhere; }
    .reference { margin: -10px 0 16px; color: light-dark(#626262, #b8b8b8); overflow-wrap: anywhere; font-size: 12px; }
    label { display: block; margin: 0 0 5px; font-weight: 600; }
    input { display: block; width: 100%; min-height: 40px; margin: 0 0 13px; padding: 8px 10px; border: 1px solid color-mix(in srgb, CanvasText 24%, Canvas); border-radius: 6px; background: Canvas; color: CanvasText; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
    .actions { display: flex; gap: 8px; margin-top: 4px; }
    button { min-height: 38px; padding: 7px 13px; border: 1px solid color-mix(in srgb, CanvasText 24%, Canvas); border-radius: 6px; background: ButtonFace; color: ButtonText; font: inherit; font-weight: 600; cursor: pointer; }
    button[type="submit"] { border-color: #246b4b; background: #246b4b; color: white; }
    button:disabled { cursor: wait; opacity: .58; }
    #status { min-height: 1.5em; margin: 12px 0 0; color: light-dark(#626262, #b8b8b8); }
    .notice { margin: 14px 0 0; padding-top: 11px; border-top: 1px solid color-mix(in srgb, CanvasText 15%, Canvas); color: light-dark(#626262, #b8b8b8); font-size: 12px; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: no-preference) { button { transition: background-color 100ms ease, opacity 100ms ease; } }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <h1 id="title">Save or replace a credential</h1>
    <p class="service" id="service"></p>
    <p class="reference" id="credential-ref"></p>
    <form id="credential-form" autocomplete="off">
      <div id="token-field" hidden>
        <label for="token">Token or API key</label>
        <input id="token" name="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="65536" required>
      </div>
      <div id="login-fields" hidden>
        <label for="username">Username or email</label>
        <input id="username" name="username" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="65536" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" maxlength="65536" required>
      </div>
      <div class="actions">
        <button type="submit" id="save" disabled>Save or replace locally</button>
        <button type="button" id="cancel" disabled>Cancel</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite">Connecting securely…</p>
    <p class="notice">Values are encrypted in this form before they leave it, then saved or replaced in the local OS credential store. The agent receives only the credential reference and save status.</p>
  </main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const form = $('credential-form'), save = $('save'), cancel = $('cancel'), status = $('status');
  const fields = [$('token'), $('username'), $('password')];
  const state = { initialized: false, hostTools: false, requestId: null, capability: null, publicKey: null, kind: null, busy: false, done: false, tornDown: false, expiry: null };
  let nextRpcId = 1;
  const pending = new Map();
  const encoder = new TextEncoder();
  const b64 = (bytes) => {
    let binary = '';
    for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(binary);
  };
  const unb64 = (value) => {
    if (typeof value !== 'string' || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value)) throw new Error('invalid key');
    const raw = atob(value), bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  };
  function sendRequest(method, params) {
    if (!window.parent || window.parent === window) return Promise.reject(new Error('bridge unavailable'));
    const id = nextRpcId++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error('host timeout')); }, 30000);
      pending.set(id, { resolve, reject, timer });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }
  function sendNotification(method, params) {
    window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
  }
  function setStatus(message) { status.textContent = message; }
  function updateButtons() {
    const ready = state.initialized && state.hostTools && !!state.requestId && !!state.capability && !!state.publicKey && !state.busy && !state.done;
    save.disabled = !ready;
    cancel.disabled = !ready;
    const active = state.kind === 'token' ? [fields[0]] : state.kind === 'login' ? fields.slice(1) : [];
    for (const input of fields) {
      input.disabled = !ready || !active.includes(input);
      input.required = active.includes(input);
    }
  }
  function clearFields() {
    for (const input of fields) input.value = '';
  }
  function acceptToolResult(result) {
    if (!result || typeof result !== 'object') return;
    const pub = result.structuredContent;
    const secret = result._meta && result._meta['guardkit/safeInput'];
    if (!state.hostTools || !pub || pub.status !== 'awaiting_user' || typeof pub.request_id !== 'string' ||
        !['token', 'login'].includes(pub.kind) || typeof pub.service !== 'string' ||
        typeof pub.credential_ref !== 'string' || !pub.credential_ref || pub.credential_ref.length > 256 ||
        !secret || secret.request_id !== pub.request_id || typeof secret.capability !== 'string' ||
        secret.capability.length < 16 || secret.capability.length > 512 || secret.expires_in !== 300) {
      setStatus('Secure input details are unavailable. Retry the request.'); return;
    }
    try {
      const der = unb64(secret.public_key_spki);
      if (der.length < 350 || der.length > 1024) throw new Error('invalid key');
      crypto.subtle.importKey('spki', der, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']).then((key) => {
        if (state.done) return;
        if (key.algorithm.modulusLength !== 3072) { setStatus('Secure encryption is unavailable in this host. No credential was sent.'); return; }
        if (state.expiry) clearTimeout(state.expiry);
        state.requestId = pub.request_id; state.capability = secret.capability; state.publicKey = key; state.kind = pub.kind;
        state.expiry = setTimeout(() => expire(), Math.min(secret.expires_in, 300) * 1000);
        $('service').textContent = 'Requested service: ' + pub.service;
        $('credential-ref').textContent = 'Credential reference: ' + pub.credential_ref;
        $('token-field').hidden = pub.kind !== 'token';
        $('login-fields').hidden = pub.kind !== 'login';
        setStatus('Ready. This request expires in five minutes.'); updateButtons();
      }).catch(() => setStatus('Secure encryption is unavailable in this host. No credential was sent.'));
    } catch (_) { setStatus('Secure encryption details are invalid. No credential was sent.'); }
  }
  function expire() {
    clearFields(); state.done = true; state.requestId = null; state.capability = null; state.publicKey = null;
    if (state.expiry) clearTimeout(state.expiry);
    state.expiry = null; setStatus('This request expired. Start a new request to continue.'); updateButtons();
  }
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || !event.data || event.data.jsonrpc !== '2.0') return;
    const message = event.data;
    if (message.method === 'ui/resource-teardown' && message.id !== undefined) {
      clearFields(); state.done = true; state.tornDown = true; state.requestId = null; state.capability = null; state.publicKey = null;
      if (state.expiry) clearTimeout(state.expiry); state.expiry = null; updateButtons();
      window.parent.postMessage({ jsonrpc: '2.0', id: message.id, result: {} }, '*'); return;
    }
    if (message.id !== undefined && pending.has(message.id)) {
      const item = pending.get(message.id); pending.delete(message.id); clearTimeout(item.timer);
      if (message.error) item.reject(new Error('host request failed'));
      else item.resolve(message.result);
      if (item.isInitialize) {
        const capabilities = message.result && message.result.hostCapabilities;
        state.hostTools = !!(capabilities && capabilities.serverTools && typeof capabilities.serverTools === 'object');
      }
      return;
    }
    if (message.method === 'ui/notifications/tool-result') acceptToolResult(message.params);
    if (message.method === 'ui/notifications/tool-cancelled') {
      expire(); setStatus('Request cancelled.');
    }
  });
  async function initialize() {
    try {
      const initId = nextRpcId;
      const initPromise = sendRequest('ui/initialize', {
        protocolVersion: '2026-01-26',
        appInfo: { name: 'Guardkit Safe Input', version: '0.1.0' },
        appCapabilities: { availableDisplayModes: ['inline'] }
      });
      const pendingInit = pending.get(initId); if (pendingInit) pendingInit.isInitialize = true;
      await initPromise;
      state.initialized = true;
      if (!state.hostTools) throw new Error('server tools unsupported');
      sendNotification('ui/notifications/initialized', {});
      updateButtons();
    } catch (_) { setStatus('The secure host connection is unavailable. Reopen this request in the supported app.'); }
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (save.disabled || state.busy) return;
    let token = fields[0].value, username = fields[1].value, password = fields[2].value;
    if (state.kind === 'token' ? !token : (!username || !password)) { setStatus('Fill in every field.'); return; }
    let payload = state.kind === 'token' ? JSON.stringify({ value: token }) : JSON.stringify({ username, password });
    token = ''; username = ''; password = '';
    if (encoder.encode(payload).byteLength > 65536) { setStatus('Credential is too large. Maximum size is 64 KiB.'); return; }
    state.busy = true; updateButtons(); setStatus('Encrypting and saving…');
    let plaintextBytes, rawKey;
    try {
      plaintextBytes = encoder.encode(payload);
      const aes = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
      rawKey = new Uint8Array(await crypto.subtle.exportKey('raw', aes));
      const nonce = crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: nonce, additionalData: encoder.encode(state.requestId), tagLength: 128 }, aes, plaintextBytes));
      const wrapped = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, state.publicKey, rawKey));
      if (state.done || state.tornDown || !state.requestId) throw new Error('request expired');
      rawKey.fill(0); rawKey = null; plaintextBytes.fill(0); plaintextBytes = null; payload = ''; clearFields();
      const result = await sendRequest('tools/call', { name: 'submit_safe_input', arguments: {
        request_id: state.requestId, capability: state.capability, wrapped_key: b64(wrapped), nonce: b64(nonce), ciphertext: b64(ciphertext)
      }});
      if (!result || result.isError || !result.structuredContent || result.structuredContent.status !== 'stored') throw new Error('save failed');
      state.done = true; state.requestId = null; state.capability = null; state.publicKey = null;
      if (state.expiry) clearTimeout(state.expiry); state.expiry = null;
      setStatus('Credential saved.');
    } catch (_) {
      if (plaintextBytes) plaintextBytes.fill(0);
      if (rawKey) rawKey.fill(0);
      payload = '';
      clearFields(); state.done = true; state.requestId = null; state.capability = null; state.publicKey = null;
      setStatus('Could not save securely. The fields were cleared; start a new request to try again.');
    } finally { state.busy = false; updateButtons(); }
  });
  cancel.addEventListener('click', async () => {
    if (!state.requestId || !state.capability || state.busy || state.done) return;
    state.busy = true; updateButtons(); clearFields(); setStatus('Cancelling…');
    try {
      const result = await sendRequest('tools/call', { name: 'cancel_safe_input', arguments: { request_id: state.requestId, capability: state.capability } });
      if (!result || result.isError || !result.structuredContent || result.structuredContent.status !== 'cancelled') throw new Error('cancel failed');
      state.done = true; state.requestId = null; state.capability = null; state.publicKey = null;
      if (state.expiry) clearTimeout(state.expiry); state.expiry = null; setStatus('Request cancelled.');
    } catch (_) { state.done = true; state.requestId = null; state.capability = null; state.publicKey = null; setStatus('Cancellation could not be confirmed. Close this form and start a new request.'); }
    finally { state.busy = false; updateButtons(); }
  });
  updateButtons(); initialize();
})();
</script>
</body>
</html>
