rules:
  - id: guardkit.python.subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: subprocess is invoked with shell=True; untrusted input may enable command injection.
    pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata:
      category: security
      confidence: HIGH
      impact: An attacker may execute operating-system commands with the application's privileges.
      remediation: Pass an argument list and keep shell=False; validate each argument.
      license: FSL-1.1-ALv2
  - id: guardkit.python.pickle-load
    languages: [python]
    severity: ERROR
    message: Deserializing untrusted data with pickle can execute arbitrary code.
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: Malicious serialized input may execute code during deserialization.
      remediation: Use a data-only format such as JSON or strictly authenticate trusted serialized data.
      license: FSL-1.1-ALv2
  - id: guardkit.python.yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: yaml.load without a safe loader can construct unsafe Python objects.
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: Crafted YAML may trigger unsafe object construction.
      remediation: Use yaml.safe_load for untrusted YAML.
      license: FSL-1.1-ALv2
  - id: guardkit.python.flask-debug
    languages: [python]
    severity: WARNING
    message: Flask debug mode should not be enabled in deployed applications.
    pattern: app.run(..., debug=True, ...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: The interactive debugger can expose sensitive runtime details and execution capabilities.
      remediation: Disable debug mode in deployed environments.
      license: FSL-1.1-ALv2
  - id: guardkit.python.requests-tls-disabled
    languages: [python]
    severity: WARNING
    message: TLS certificate verification is disabled for an HTTP request.
    pattern: requests.$METHOD(..., verify=False, ...)
    metadata:
      category: security
      confidence: HIGH
      impact: A network attacker may intercept or alter traffic to the remote service.
      remediation: Enable certificate verification and configure a trusted CA bundle if needed.
      license: FSL-1.1-ALv2
  - id: guardkit.python.sql-injection
    languages: [python]
    mode: taint
    severity: ERROR
    message: Request data reaches a SQL execute query argument; use parameterized queries.
    pattern-sources:
      - pattern: request.args[...]
      - pattern: request.args.get(...)
      - pattern: request.form[...]
      - pattern: request.form.get(...)
    pattern-sinks:
      - pattern: $CURSOR.execute($QUERY)
    metadata:
      category: security
      confidence: MEDIUM
      impact: An attacker may alter SQL commands and read or modify database records.
      remediation: Use parameterized queries and keep user data in separate bound parameters.
      license: FSL-1.1-ALv2
  - id: guardkit.python.ssrf
    languages: [python]
    mode: taint
    severity: WARNING
    message: Request-controlled URL reaches an outbound HTTP request.
    pattern-sources:
      - pattern: request.args[...]
      - pattern: request.args.get(...)
      - pattern: request.form[...]
      - pattern: request.form.get(...)
    pattern-sinks:
      - pattern: requests.get($URL, ...)
      - pattern: requests.post($URL, ...)
      - pattern: urllib.request.urlopen($URL, ...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: An attacker may cause server requests to internal or restricted network services.
      remediation: Allowlist destinations and reject private, loopback, and link-local addresses after resolution.
      license: FSL-1.1-ALv2
  - id: guardkit.python.path-traversal
    languages: [python]
    mode: taint
    severity: WARNING
    message: Request-controlled path reaches a filesystem read.
    pattern-sources:
      - pattern: request.args[...]
      - pattern: request.args.get(...)
      - pattern: request.form[...]
      - pattern: request.form.get(...)
    pattern-sinks:
      - pattern: open($PATH, ...)
      - pattern: send_file($PATH, ...)
    metadata:
      category: security
      confidence: MEDIUM
      impact: Path manipulation may expose files outside the intended directory.
      remediation: Resolve against a fixed base directory and verify the resolved path remains within it.
      license: FSL-1.1-ALv2
  - id: guardkit.python.jwt-signature-disabled
    languages: [python]
    severity: ERROR
    message: JWT signature verification is explicitly disabled.
    pattern: >-
      jwt.decode(..., options={..., "verify_signature": False, ...}, ...)
    metadata:
      category: security
      confidence: HIGH
      impact: An attacker may forge tokens accepted by the application.
      remediation: Require signature verification and allowlist expected signing algorithms.
      license: FSL-1.1-ALv2
